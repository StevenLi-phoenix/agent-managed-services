id = "notificationservice"
secrets = ["SVC_SECRET"]
depends_on = ["registry"]

[start]
argv = ["uvicorn", "notificationservice.main:build_app", "--factory", "--host", "127.0.0.1", "--port", "${PORT_main}"]
workdir = "repo/services/notificationservice"

[env]
AUTH_URL = "http://127.0.0.1:19101"
BARK_SERVER_URL = "https://api.day.app"
GIT_COMMIT = "0123456789abcdef0123456789abcdef01234567"
NOTIFY_DB_PATH = "/home/harness/state/services/notificationservice/root/data/notificationservice.db"
PORT = "${PORT_main}"
REGISTRY_URL = "http://127.0.0.1:19100"
SVC_AUDIENCE = "notificationservice"
SVC_CAPABILITIES = "notify,push"
SVC_HEALTH_PATH = "/health"
SVC_M2M_PUBLIC_KEY_PATH = "/home/harness/state/services/notificationservice/root/etc/jwt-rs256.pub"
SVC_NAME = "notificationservice"
SVC_OWNER = "lishuyu"
SVC_ROOT_PATH = "/notify"

[ports]
main = 0

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "http"
port = "main"
path = "/health"
start_period_s = 120.0

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
memory_max = "120M"
cpu_max = "40%"
pids_max = 64

[restart]
policy = "on-failure"
backoff_s = 5.0
