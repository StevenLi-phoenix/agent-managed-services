id = "pages"
name = "Pages"
secrets = ["SVC_SECRET"]
depends_on = ["registry"]

[start]
argv = ["uvicorn", "pages.main:build_app", "--factory", "--host", "127.0.0.1", "--port", "${PORT_main}"]
workdir = "repo/apps/pages"

[env]
AUTH_URL = "http://127.0.0.1:19101"
GIT_COMMIT = "0123456789abcdef0123456789abcdef01234567"
PAGES_ANON_EXPIRY_DAYS = "30"
PAGES_ANON_MAX_PAGES = "500"
PAGES_ANON_RATE_LIMIT = "10"
PAGES_DB_PATH = "/home/harness/state/services/pages/root/data/pages.db"
PAGES_MAX_PER_USER = "200"
PAGES_MAX_SIZE_MB = "10"
PORT = "${PORT_main}"
REGISTRY_URL = "http://127.0.0.1:19100"
SVC_AUDIENCE = "pages"
SVC_CAPABILITIES = "pagehosting,statichosting"
SVC_DISPLAY_NAME = "Pages"
SVC_ENDPOINT = "https://pages.shuyuli.com"
SVC_HEALTH_PATH = "/health"
SVC_M2M_PUBLIC_KEY_PATH = "/home/harness/state/services/pages/root/etc/jwt-rs256.pub"
SVC_NAME = "pages"
SVC_OWNER = "steven"

[ports]
main = 0

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "http"
port = "main"
path = "/health"
start_period_s = 120.0

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
memory_max = "200M"
cpu_max = "40%"
pids_max = 64

[restart]
policy = "on-failure"
backoff_s = 5.0
