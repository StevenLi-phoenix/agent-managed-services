id = "logservice"
secrets = ["SVC_SECRET"]

[start]
argv = ["uvicorn", "logservice.main:build_app", "--factory", "--host", "127.0.0.1", "--port", "${PORT_main}"]
workdir = "repo/services/logservice"

[env]
AUTH_URL = "http://127.0.0.1:19101"
GIT_COMMIT = "0123456789abcdef0123456789abcdef01234567"
LOG_DB_PATH = "/home/harness/state/services/logservice/root/data/logservice.db"
PORT = "${PORT_main}"
REGISTRY_URL = "http://127.0.0.1:19100"
SVC_AUDIENCE = "logservice"
SVC_CAPABILITIES = "logs,aggregation"
SVC_HEALTH_PATH = "/health"
SVC_M2M_PUBLIC_KEY_PATH = "/home/harness/state/services/logservice/root/etc/jwt-rs256.pub"
SVC_NAME = "logservice"
SVC_OWNER = "steven"
SVC_ROOT_PATH = "/logs"

[ports]
main = 0

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "http"
port = "main"
path = "/health"
start_period_s = 120.0

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
memory_max = "200M"
cpu_max = "40%"
pids_max = 64

[restart]
policy = "on-failure"
backoff_s = 5.0
