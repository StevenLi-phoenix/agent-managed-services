id = "timeservice"
name = "Time Service"
secrets = ["SVC_SECRET"]
depends_on = ["registry"]

[start]
argv = ["uvicorn", "timeservice.main:build_app", "--factory", "--host", "127.0.0.1", "--port", "${PORT_main}"]
workdir = "repo/apps/timeservice"

[env]
AUTH_URL = "http://127.0.0.1:19101"
GIT_COMMIT = "0123456789abcdef0123456789abcdef01234567"
PORT = "${PORT_main}"
REGISTRY_URL = "http://127.0.0.1:19100"
SVC_AUDIENCE = "timeservice"
SVC_CAPABILITIES = "time"
SVC_DISPLAY_NAME = "Time Service"
SVC_HEALTH_PATH = "/health"
SVC_M2M_PUBLIC_KEY_PATH = "/home/harness/state/services/timeservice/root/etc/jwt-rs256.pub"
SVC_NAME = "timeservice"
SVC_OWNER = "lishuyu"
SVC_ROOT_PATH = "/time"

[ports]
main = 0

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "http"
port = "main"
path = "/health"
start_period_s = 120.0

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
memory_max = "150M"
cpu_max = "40%"
pids_max = 64

[restart]
policy = "on-failure"
backoff_s = 5.0
