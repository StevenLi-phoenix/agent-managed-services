id = "commentservice"
secrets = ["SVC_SECRET"]

[start]
argv = ["uvicorn", "commentservice.main:build_app", "--factory", "--host", "127.0.0.1", "--port", "${PORT_main}"]
workdir = "repo/services/commentservice"

[env]
AUTH_URL = "http://127.0.0.1:19101"
BLOG_BASE_URL = "https://blog.lishuyu.app"
COMMENT_DB_PATH = "/home/harness/state/services/commentservice/root/data/commentservice.db"
DEEPSEEK_BASE_URL = "https://api.deepseek.com"
DEEPSEEK_MODEL = "deepseek-chat"
GIT_COMMIT = "0123456789abcdef0123456789abcdef01234567"
MODERATION_BATCH_SIZE = "20"
MODERATION_INTERVAL_SEC = "30"
PORT = "${PORT_main}"
REGISTRY_URL = "http://127.0.0.1:19100"
SVC_AUDIENCE = "commentservice"
SVC_CAPABILITIES = "comments"
SVC_HEALTH_PATH = "/health"
SVC_M2M_PUBLIC_KEY_PATH = "/home/harness/state/services/commentservice/root/etc/jwt-rs256.pub"
SVC_NAME = "commentservice"
SVC_OWNER = "lishuyu"
SVC_ROOT_PATH = "/comments"

[ports]
main = 0

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "http"
port = "main"
path = "/health"
start_period_s = 120.0

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
memory_max = "150M"
cpu_max = "40%"
pids_max = 64

[restart]
policy = "on-failure"
backoff_s = 5.0
