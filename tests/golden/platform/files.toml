id = "files"
name = "Files Service"
secrets = ["SVC_SECRET"]
depends_on = ["registry"]

[start]
argv = ["uvicorn", "files.main:build_app", "--factory", "--host", "127.0.0.1", "--port", "${PORT_main}"]
workdir = "repo/apps/files"

[env]
AUTH_URL = "http://127.0.0.1:19101"
FILES_ANON_EXPIRY_DAYS = "7"
FILES_ANON_MAX_UPLOAD_MB = "50"
FILES_ANON_RATE_LIMIT = "20"
FILES_DB_PATH = "/home/harness/state/services/files/root/data/files.db"
FILES_DEFAULT_QUOTA_MB = "1024"
FILES_MAX_UPLOAD_MB = "100"
GIT_COMMIT = "0123456789abcdef0123456789abcdef01234567"
PORT = "${PORT_main}"
REGISTRY_URL = "http://127.0.0.1:19100"
SVC_AUDIENCE = "files"
SVC_CAPABILITIES = "filestorage"
SVC_DISPLAY_NAME = "Files Service"
SVC_HEALTH_PATH = "/health"
SVC_M2M_PUBLIC_KEY_PATH = "/home/harness/state/services/files/root/etc/jwt-rs256.pub"
SVC_NAME = "files"
SVC_OWNER = "steven"
SVC_ROOT_PATH = "/files"

[ports]
main = 0

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "http"
port = "main"
path = "/health"
start_period_s = 120.0

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
memory_max = "200M"
cpu_max = "40%"
pids_max = 64

[restart]
policy = "on-failure"
backoff_s = 5.0
