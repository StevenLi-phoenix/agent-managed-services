schema_version: 1

# Public URL is /time (see mount.path); internal identifiers stay `timeservice`
# on purpose — renaming name/audience/user would create a fresh systemd unit +
# service user on the droplet and orphan the old ones. The short name is a
# mount-level concern only.
name: timeservice
display_name: Time Service
audience: timeservice
owner: lishuyu

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
    # No `path:` — stage rsyncs the whole monorepo into target_dir so
    # apps/timeservice/pyproject.toml's relative `path = "../../components/sdk"`
    # source resolves on the droplet exactly as it does on dev machines.
  install:
    - cd apps/timeservice && /usr/local/bin/uv sync
  target_dir: /srv/timeservice
  user: timeservice

process:
  exec: /srv/timeservice/apps/timeservice/.venv/bin/uvicorn timeservice.main:build_app --factory --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/timeservice/apps/timeservice
  environment:
    SVC_ROOT_PATH: /time
  restart: on-failure
  restart_sec: 5

mount:
  gateway: api.lishuyu.app
  path: /time
  port: 9200

acl:
  - {action: read,  principal: anon,    effect: allow}
  - {action: read,  principal: "user:*", effect: allow}
  - {action: write, principal: admin,   effect: allow}

registry:
  capabilities: [time]
  health_path: /health
