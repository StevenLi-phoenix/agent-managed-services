schema_version: 1
kind: service
name: kvservice
audience: kvservice
owner: steven

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
  install:
    - cd services/kvservice && /usr/local/bin/uv sync
  target_dir: /srv/kvservice
  user: kvservice

process:
  exec: /srv/kvservice/services/kvservice/.venv/bin/uvicorn kvservice.main:build_app --factory --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/kvservice/services/kvservice
  environment:
    SVC_ROOT_PATH: /kv
    KV_DB_PATH: /var/lib/kvservice/kvservice.db
  restart: on-failure
  restart_sec: 5
  memory_max: 100M

mount:
  gateway: api.lishuyu.app
  path: /kv
  port: 9203

acl:
  - {action: read,  principal: "user:*",    effect: allow}
  - {action: write, principal: "user:*",    effect: allow}
  - {action: read,  principal: "service:*", effect: allow}
  - {action: write, principal: "service:*", effect: allow}
  - {action: read,  principal: admin,       effect: allow}
  - {action: write, principal: admin,       effect: allow}

registry:
  capabilities: [keyvalue]
  health_path: /health

