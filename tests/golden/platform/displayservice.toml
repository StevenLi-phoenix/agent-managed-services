id = "displayservice"
name = "TRMNL Display Service"
secrets = ["SVC_SECRET"]

[start]
argv = ["uvicorn", "displayservice.main:app", "--host", "127.0.0.1", "--port", "${PORT_main}"]
workdir = "repo/apps/displayservice"

[env]
AUTH_URL = "http://127.0.0.1:19101"
DISPLAY_PUBLIC_URL = "https://display.lishuyu.app"
DISPLAY_TIMEZONE = "America/New_York"
GIT_COMMIT = "0123456789abcdef0123456789abcdef01234567"
PORT = "${PORT_main}"
REGISTRY_URL = "http://127.0.0.1:19100"
SVC_AUDIENCE = "displayservice"
SVC_CAPABILITIES = "display,eink,trmnl"
SVC_DISPLAY_NAME = "TRMNL Display Service"
SVC_ENDPOINT = "https://display.lishuyu.app"
SVC_HEALTH_PATH = "/health"
SVC_M2M_PUBLIC_KEY_PATH = "/home/harness/state/services/displayservice/root/etc/jwt-rs256.pub"
SVC_NAME = "displayservice"
SVC_OWNER = "lishuyu"

[ports]
main = 0

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "http"
port = "main"
path = "/health"
start_period_s = 120.0

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
memory_max = "150M"
cpu_max = "40%"
pids_max = 64

[restart]
policy = "on-failure"
backoff_s = 5.0
