schema_version: 1

# Public URL is /llm-live-pricing (see mount.path); internal identifiers stay
# `llmpricing` — package names can't carry hyphens and the short id keeps the
# systemd unit / service user / registry row consistent. The long descriptive
# name is a mount-level concern only (same convention as timeservice → /time).
name: llmpricing
display_name: LLM Live Pricing
audience: llmpricing
owner: lishuyu

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
    # No `path:` — stage rsyncs the whole monorepo into target_dir so
    # apps/llmpricing/pyproject.toml's relative `path = "../../components/sdk"`
    # source resolves on the droplet exactly as it does on dev machines.
  install:
    - cd apps/llmpricing && /usr/local/bin/uv sync
  target_dir: /srv/llmpricing
  user: llmpricing

process:
  exec: /srv/llmpricing/apps/llmpricing/.venv/bin/uvicorn llmpricing.main:build_app --factory --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/llmpricing/apps/llmpricing
  environment:
    SVC_ROOT_PATH: /llm-live-pricing
  restart: on-failure
  restart_sec: 5

mount:
  gateway: api.lishuyu.app
  path: /llm-live-pricing
  port: 9218

acl:
  - {action: read,  principal: anon,    effect: allow}
  - {action: read,  principal: "user:*", effect: allow}
  - {action: write, principal: admin,   effect: allow}

registry:
  capabilities: [llm-pricing]
  health_path: /health
