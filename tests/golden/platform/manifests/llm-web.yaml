schema_version: 1
kind: static
name: llm-web
display_name: "LLM Gateway Web"
owner: steven

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
    # Stage ONLY this app (files-web precedent): the repo is PRIVATE and
    # Caddy's file_server serves target_dir directly — never stage the whole
    # monorepo behind a static mount.
    path: apps/llm-web
  install:
    # No build step (hand-written page + lib.js/app.js) — just drop the
    # non-servables: manifest, docs, tests and the bun test package.json.
    - rm -f service.yaml README.md lib.test.js package.json
  target_dir: /srv/llm-web

# Pure display frontend for services/llmgateway (issue #80: backend API on
# api.lishuyu.app/llm, human-facing page on the llm subdomain).
mount:
  gateway: llm.lishuyu.app
  subdomain: llm
