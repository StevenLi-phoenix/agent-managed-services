schema_version: 1
kind: service
name: wechatservice
audience: wechatservice
owner: lishuyu

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
  install:
    - cd services/wechatservice && /usr/local/bin/uv sync
  target_dir: /srv/wechatservice
  user: wechatservice

process:
  exec: /srv/wechatservice/services/wechatservice/.venv/bin/uvicorn wechatservice.main:build_app --factory --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/wechatservice/services/wechatservice
  environment:
    SVC_ROOT_PATH: /wechat
    # forward-auth via droplet loopback — the public auth.lishuyu.app URL
    # hairpins through Cloudflare and adds ~400-500ms to every cold resolve
    AUTH_URL: http://127.0.0.1:8001
    WECHAT_TOKEN_CACHE: /var/lib/wechatservice/token-cache.json
    # WECHAT_MP_APPID / WECHAT_MP_APPSECRET are secrets — hand-added to
    # /etc/wechatservice/env after bootstrap/svc-init.sh, never in the repo.
  restart: on-failure
  restart_sec: 5
  memory_max: 150M

mount:
  gateway: api.lishuyu.app
  path: /wechat
  port: 9214

acl:
  - {action: read,  principal: admin, effect: allow}
  - {action: write, principal: admin, effect: allow}

registry:
  capabilities: [wechat-publish]
  health_path: /health
