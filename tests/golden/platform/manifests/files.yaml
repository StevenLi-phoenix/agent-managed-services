schema_version: 1
kind: service
name: files
display_name: "Files Service"
audience: files
owner: steven

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
  install:
    - cd apps/files && /usr/local/bin/uv sync
  target_dir: /srv/files
  user: files

process:
  exec: /srv/files/apps/files/.venv/bin/uvicorn files.main:build_app --factory --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/files/apps/files
  environment:
    SVC_ROOT_PATH: /files
    FILES_DB_PATH: /var/lib/files/files.db
    FILES_MAX_UPLOAD_MB: "100"
    FILES_DEFAULT_QUOTA_MB: "1024"
    FILES_ANON_EXPIRY_DAYS: "7"
    FILES_ANON_MAX_UPLOAD_MB: "50"
    FILES_ANON_RATE_LIMIT: "20"
  restart: on-failure
  restart_sec: 5
  memory_max: 200M

mount:
  gateway: api.lishuyu.app
  path: /files
  port: 9206

acl:
  - {action: read,  principal: anon,       effect: allow}
  - {action: write, principal: anon,       effect: allow}
  - {action: read,  principal: "user:*",   effect: allow}
  - {action: write, principal: "user:*",   effect: allow}
  - {action: read,  principal: admin,      effect: allow}
  - {action: write, principal: admin,      effect: allow}

registry:
  capabilities: [filestorage]
  health_path: /health

