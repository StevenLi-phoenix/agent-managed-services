schema_version: 1

name: mailbox
display_name: Mailbox
audience: mailbox
owner: lishuyu

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
    # No `path:` — stage rsyncs the whole monorepo into target_dir so
    # apps/mailbox/pyproject.toml's relative `path = "../../components/sdk"`
    # source resolves on the droplet exactly as it does on dev machines.
  install:
    - cd apps/mailbox && /usr/local/bin/uv sync
  target_dir: /srv/mailbox
  user: mailbox

process:
  # Import package is `mailboxsvc` (stdlib owns `mailbox`); service name is still `mailbox`.
  exec: /srv/mailbox/apps/mailbox/.venv/bin/uvicorn mailboxsvc.main:build_app --factory --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/mailbox/apps/mailbox
  environment:
    # Subdomain mount: no SVC_ROOT_PATH (no prefix to strip). Endpoint set
    # explicitly so Registry doesn't derive the api.lishuyu.app default.
    # MAILBOX_INGEST_TOKEN is a secret — provided by the droplet's
    # /etc/mailbox/env, never in this manifest.
    SVC_ENDPOINT: https://mail.lishuyu.app
    MAILBOX_DB_PATH: /var/lib/mailbox/mailbox.db
  restart: on-failure
  restart_sec: 5
  memory_max: 200M

# api.lishuyu.app is for pure-API services; UI-bearing services get their own
# subdomain (displayservice/locationservice precedent — user decision 2026-06-11).
mount:
  gateway: mail.lishuyu.app
  subdomain: mail
  port: 9215

# Personal inbox: owner (admin) only. The catch-all worker authenticates with
# MAILBOX_INGEST_TOKEN (write-only, in-app) and bypasses this ACL by design.
acl:
  - {action: read,  principal: admin, effect: allow}
  - {action: write, principal: admin, effect: allow}

registry:
  capabilities: [mailbox, email, inbox]
  health_path: /health
