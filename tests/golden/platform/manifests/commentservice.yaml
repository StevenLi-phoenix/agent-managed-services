schema_version: 1
kind: service
name: commentservice
audience: commentservice
owner: lishuyu

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
  install:
    - cd services/commentservice && /usr/local/bin/uv sync
  target_dir: /srv/commentservice
  user: commentservice

process:
  exec: /srv/commentservice/services/commentservice/.venv/bin/uvicorn commentservice.main:build_app --factory --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/commentservice/services/commentservice
  environment:
    SVC_ROOT_PATH: /comments
    COMMENT_DB_PATH: /var/lib/commentservice/commentservice.db
    # forward-auth via droplet loopback — the public auth.lishuyu.app URL
    # hairpins through Cloudflare and adds ~400-500ms to every cold resolve
    AUTH_URL: http://127.0.0.1:8001
    BLOG_BASE_URL: https://blog.lishuyu.app
    MODERATION_INTERVAL_SEC: "30"
    MODERATION_BATCH_SIZE: "20"
    DEEPSEEK_BASE_URL: https://api.deepseek.com
    DEEPSEEK_MODEL: deepseek-chat
  restart: on-failure
  restart_sec: 5
  memory_max: 150M

mount:
  gateway: api.lishuyu.app
  path: /comments
  port: 9211

acl:
  - {action: read,  principal: anon,     effect: allow}
  - {action: write, principal: anon,     effect: allow}
  - {action: read,  principal: "user:*", effect: allow}
  - {action: write, principal: "user:*", effect: allow}
  - {action: read,  principal: admin,    effect: allow}
  - {action: write, principal: admin,    effect: allow}

registry:
  capabilities: [comments]
  health_path: /health
