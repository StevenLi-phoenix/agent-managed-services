schema_version: 1
kind: service
name: oss
display_name: "Object Storage Service"
audience: oss
owner: steven

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
  install:
    - cd services/oss && /usr/local/bin/uv sync
  target_dir: /srv/oss
  user: oss

process:
  exec: /srv/oss/services/oss/.venv/bin/uvicorn oss.main:build_app --factory --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/oss/services/oss
  environment:
    SVC_ROOT_PATH: /oss
    OSS_DB_PATH: /var/lib/oss/oss.db
    OSS_MAX_SINGLE_UPLOAD_MB: "50"
  restart: on-failure
  restart_sec: 5
  memory_max: 200M

mount:
  gateway: api.lishuyu.app
  path: /oss
  port: 9204

acl:
  - {action: read,  principal: "user:*",    effect: allow}
  - {action: write, principal: "user:*",    effect: allow}
  - {action: read,  principal: "service:*", effect: allow}
  - {action: write, principal: "service:*", effect: allow}
  - {action: read,  principal: admin,       effect: allow}
  - {action: write, principal: admin,       effect: allow}

registry:
  capabilities: [objectstorage, r2]
  health_path: /health

