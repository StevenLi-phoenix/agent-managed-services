schema_version: 1

name: displayservice
display_name: TRMNL Display Service
audience: displayservice
owner: lishuyu

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
  install:
    - cd apps/displayservice && /usr/local/bin/uv sync
  target_dir: /srv/displayservice
  user: displayservice

process:
  exec: /srv/displayservice/apps/displayservice/.venv/bin/uvicorn displayservice.main:app --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/displayservice/apps/displayservice
  environment:
    # Subdomain mount: no SVC_ROOT_PATH. Endpoint set explicitly so Registry
    # doesn't fall back to the api.lishuyu.app default.
    SVC_ENDPOINT: https://display.lishuyu.app
    DISPLAY_PUBLIC_URL: https://display.lishuyu.app
    DISPLAY_TIMEZONE: America/New_York
  restart: on-failure
  restart_sec: 5

# status.lishuyu.app is reserved for the uptime status page; the display
# service now lives at display.lishuyu.app. During the firmware transition a
# manual Caddy snippet keeps status.lishuyu.app proxying here too.
mount:
  gateway: display.lishuyu.app
  subdomain: display
  port: 9207

acl:
  - {action: read,  principal: anon,     effect: allow}
  - {action: read,  principal: "user:*", effect: allow}
  - {action: write, principal: "user:*", effect: allow}
  - {action: write, principal: admin,    effect: allow}

registry:
  capabilities: [display, eink, trmnl]
  health_path: /health
