schema_version: 1
kind: service
name: messageservice
audience: messageservice
owner: lishuyu

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
  install:
    - cd services/messageservice && /usr/local/bin/uv sync
  target_dir: /srv/messageservice
  user: messageservice

process:
  exec: /srv/messageservice/services/messageservice/.venv/bin/uvicorn messageservice.main:build_app --factory --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/messageservice/services/messageservice
  environment:
    SVC_ROOT_PATH: /message
    MESSAGE_DB_PATH: /var/lib/messageservice/messageservice.db
  restart: on-failure
  restart_sec: 5
  memory_max: 100M

mount:
  gateway: api.lishuyu.app
  path: /message
  port: 9209

acl:
  - {action: read,  principal: "user:*",    effect: allow}
  - {action: write, principal: "user:*",    effect: allow}
  - {action: read,  principal: "service:*", effect: allow}
  - {action: write, principal: "service:*", effect: allow}
  - {action: read,  principal: admin,       effect: allow}
  - {action: write, principal: admin,       effect: allow}

registry:
  capabilities: [messages, notify]
  health_path: /health
