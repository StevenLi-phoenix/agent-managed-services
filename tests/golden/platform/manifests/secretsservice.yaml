schema_version: 1
kind: service
name: secretsservice
audience: secretsservice
owner: steven

deploy:
  source:
    type: git
    repo: StevenLi-phoenix/api
    branch: main
  install:
    - cd services/secretsservice && /usr/local/bin/uv sync
  target_dir: /srv/secretsservice
  user: secretsservice

process:
  exec: /srv/secretsservice/services/secretsservice/.venv/bin/uvicorn secretsservice.main:build_app --factory --host 127.0.0.1 --port ${PORT}
  working_dir: /srv/secretsservice/services/secretsservice
  environment:
    SVC_ROOT_PATH: /secrets
    SECRETS_DB_PATH: /var/lib/secretsservice/secrets.db
  restart: on-failure
  restart_sec: 5
  memory_max: 100M

mount:
  gateway: api.lishuyu.app
  path: /secrets
  port: 9205

acl:
  - {action: read,  principal: "user:*",    effect: allow}
  - {action: write, principal: "user:*",    effect: allow}
  - {action: read,  principal: "service:*", effect: allow}
  - {action: write, principal: "service:*", effect: allow}
  - {action: read,  principal: admin,       effect: allow}
  - {action: write, principal: admin,       effect: allow}

registry:
  capabilities: [secrets]
  health_path: /health

