id = "mailbox"
name = "Mailbox"
secrets = ["SVC_SECRET"]
depends_on = ["registry"]

[start]
argv = ["uvicorn", "mailboxsvc.main:build_app", "--factory", "--host", "127.0.0.1", "--port", "${PORT_main}"]
workdir = "repo/apps/mailbox"

[env]
AUTH_URL = "http://127.0.0.1:19101"
GIT_COMMIT = "0123456789abcdef0123456789abcdef01234567"
MAILBOX_DB_PATH = "/home/harness/state/services/mailbox/root/data/mailbox.db"
PORT = "${PORT_main}"
REGISTRY_URL = "http://127.0.0.1:19100"
SVC_AUDIENCE = "mailbox"
SVC_CAPABILITIES = "mailbox,email,inbox"
SVC_DISPLAY_NAME = "Mailbox"
SVC_ENDPOINT = "https://mail.lishuyu.app"
SVC_HEALTH_PATH = "/health"
SVC_M2M_PUBLIC_KEY_PATH = "/home/harness/state/services/mailbox/root/etc/jwt-rs256.pub"
SVC_NAME = "mailbox"
SVC_OWNER = "lishuyu"

[ports]
main = 0

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "http"
port = "main"
path = "/health"
start_period_s = 120.0

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
memory_max = "200M"
cpu_max = "40%"
pids_max = 64

[restart]
policy = "on-failure"
backoff_s = 5.0
