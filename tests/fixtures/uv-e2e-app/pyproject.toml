# Minimal uv project for the Linux platform e2e (tests/linux/test_platform_e2e.py).
#
# The manifest translator always emits runtime.kind = "uv" with sync = true
# (PLAN-allin Q2), so `provision` really runs `uv sync --frozen` on the target
# host. This is the smallest tree that satisfies it:
#
#   * no dependencies, so `uv sync` needs no index and no network;
#   * `package = false`, so uv does not try to BUILD the project (which would
#     need a build backend fetched from PyPI);
#   * uv.lock committed beside it, because provisioning falls back to a
#     resolving `uv sync` (and warns) when there is no lock file.
#
# The lock was generated once with `uv lock` and is checked in deliberately:
# regenerating it on the box would put the e2e's runtime on the network.
[project]
name = "ams-e2e-app"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = false
