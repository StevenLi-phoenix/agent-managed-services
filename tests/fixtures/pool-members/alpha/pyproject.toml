# A minimal uv project for the pool runner live test
# (tests/linux/test_pool_runner_live.py). No fastapi dependency: pool_runner.py
# is framework-agnostic (it only needs an ASGI callable), so the fixture is a
# hand-rolled ASGI app to keep provisioning fast and network-light. `uvicorn`
# is installed once into the shared pool venv by the test itself, pinned to
# the version PLAN-pool.md §4.4 pins the runner to.
[project]
name = "alpha"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = []

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
