[project]
name = "ams"
version = "2.0.0"
description = "Agent managed services: a rootless Linux supervisor (userns + cgroup v2) with an escalation channel for an operator agent"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "ruff>=0.5"]

[project.scripts]
ams = "ams.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Package data, never imported: core_plan.mjs runs under the tree's own node.
"ams.platform" = ["assets/*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
timeout = 60
markers = [
  "linux: requires Linux host with userns + delegated cgroup (run via scripts/remote-test.sh)",
]
log_cli_level = "DEBUG"

[tool.ruff]
line-length = 100
target-version = "py312"
# one-off probe scripts kept as evidence, not maintained code
extend-exclude = ["docs/design/history"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
