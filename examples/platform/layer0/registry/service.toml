# Generated by ams.platform.bootstrap -- do not hand-edit.
#
# Layer 0 of the racknerd replica:
#   the service catalog, heartbeat collector, ACL store and M2M token minter
#
# Regenerating is idempotent, so a local edit is silently reverted on the next
# `ams platform bootstrap`; change the generator instead.
#
# The port is FIXED, not allocated (DECISIONS D22, T2.1): every cross reference in the
# replica -- the other Layer-0 service's URL, the JWT issuer, and the
# REGISTRY_URL/AUTH_URL injected into all 20 Layer-1 declarations -- is a
# literal, and a declaration can only expand its own ${PORT_<name>}.
#
# Secret VALUES are never here. `secrets = [...]` lists names; the harness reads
# the values out of <state>/secrets/<id>/ at spawn (D16).

id = "registry"
name = "Registry"
secrets = ["REGISTRY_ADMIN_TOKEN"]

[start]
argv = ["uvicorn", "registry.main:app", "--host", "127.0.0.1", "--port", "${PORT_main}"]
workdir = "repo/components/registry"

[env]
REGISTRY_AUTH_URL = "http://127.0.0.1:20101"
REGISTRY_DB_PATH = "/home/harness/store/state/services/registry/root/data/registry.db"
REGISTRY_JWT_ISSUER = "http://127.0.0.1:20101"
REGISTRY_JWT_PRIVATE_KEY_PATH = "/home/harness/store/state/services/registry/root/etc/jwt-rs256.pem"
REGISTRY_MIGRATIONS_DIR = "/home/harness/store/state/services/registry/root/repo/components/registry/migrations"
REGISTRY_RUNTIME_DB_PATH = "/home/harness/store/state/services/registry/root/data/registry-runtime.db"

[ports]
main = 20100

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "http"
port = "main"
path = "/health"
start_period_s = 120.0

[logging]
format = "level-prefix"

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
memory_max = "200M"
pids_max = 64

[restart]
policy = "always"
backoff_s = 1.0
