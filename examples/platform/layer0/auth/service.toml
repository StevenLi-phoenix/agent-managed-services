# Generated by ams.platform.bootstrap -- do not hand-edit.
#
# Layer 0 of the racknerd replica:
#   user JWTs, personal access tokens and the JWKS endpoint
#
# Regenerating is idempotent, so a local edit is silently reverted on the next
# `ams platform bootstrap`; change the generator instead.
#
# The port is FIXED, not allocated (DECISIONS D22, T2.1): every cross reference in the
# replica -- the other Layer-0 service's URL, the JWT issuer, and the
# REGISTRY_URL/AUTH_URL injected into all 20 Layer-1 declarations -- is a
# literal, and a declaration can only expand its own ${PORT_<name>}.
#
# Secret VALUES are never here. `secrets = [...]` lists names; the harness reads
# the values out of <state>/secrets/<id>/ at spawn (D16).

id = "auth"
name = "Auth"
secrets = ["AUTH_SESSION_SECRET", "AUTH_PAT_VERIFY_TOKEN", "AUTH_M2M_SECRET"]

[start]
argv = ["uvicorn", "auth.main:app", "--host", "127.0.0.1", "--port", "${PORT_main}"]
workdir = "repo/components/auth"

[env]
AUTH_ALLOWED_RETURN_TO_HOSTS = "127.0.0.1"
AUTH_COOKIE_DOMAIN = ""
AUTH_DB_PATH = "/home/harness/store/state/services/auth/root/data/auth.db"
AUTH_INSECURE_COOKIES = "1"
AUTH_JWT_ISSUER = "http://127.0.0.1:20101"
AUTH_JWT_PRIVATE_KEY_PATH = "/home/harness/store/state/services/auth/root/etc/jwt-rs256.pem"
AUTH_JWT_PUBLIC_KEY_PATH = "/home/harness/store/state/services/auth/root/etc/jwt-rs256.pub"
AUTH_MIGRATIONS_DIR = "/home/harness/store/state/services/auth/root/repo/components/auth/migrations"
AUTH_OPEN_REGISTRATION = "0"
AUTH_REGISTRY_URL = "http://127.0.0.1:20100"

[ports]
main = 20101

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "tcp"
port = "main"
start_period_s = 120.0

[logging]
format = "level-prefix"

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
memory_max = "200M"
pids_max = 64

[restart]
policy = "always"
backoff_s = 1.0
