# timeservice — a replica of StevenLi-phoenix/api apps/timeservice run under ams.
#
# Generated for the api pilot (.claude/state/pilot-api.md). Not the production
# deployment: no registry, no auth, its own throw-away SVC_SECRET.
id = "timeservice"
name = "Time Service (api pilot replica)"

[start]
argv = [
  "uvicorn",
  "timeservice.main:build_app",
  "--factory",
  "--host",
  "127.0.0.1",
  "--port",
  "${PORT_main}",
]
# Same reason as kvservice: `sdk = { path = "../../components/sdk" }` is
# resolved relative to the project, so the whole monorepo is copied to <root>/repo.
workdir = "repo/apps/timeservice"

[ports]
main = 0

[env]
SVC_NAME = "timeservice"
SVC_AUDIENCE = "timeservice"
# Replica secret, generated for this pilot; never leaves the box (SVC_DEV=1).
SVC_SECRET = "REDACTED-throwaway-svc-secret"
# timeservice runs its own lifespan that calls Registry.start() directly. Without
# SVC_DEV=1 that is a blocking POST to REGISTRY_URL whose failure aborts startup.
SVC_DEV = "1"
SVC_ROOT_PATH = "/time"
# Defence in depth: timeservice makes no network call at all in dev mode, but a
# replica must not be one env-var edit away from heartbeating into production.
REGISTRY_URL = "http://127.0.0.1:1"
AUTH_URL = "http://127.0.0.1:1"

[runtime]
kind = "uv"
python = "3.12"
sync = true

[health]
kind = "http"
port = "main"
path = "/health"
interval_s = 10.0
timeout_s = 5.0
start_period_s = 60.0

[stop]
signal = "SIGTERM"
timeout_s = 10.0

[limits]
# The upstream manifest declares no memory_max; 100M matches what the pilot
# brief asked for and is roughly 1.5x the observed RSS.
memory_max = "100M"
pids_max = 64

[restart]
policy = "on-failure"
